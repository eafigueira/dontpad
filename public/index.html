<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu dontpad</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
    }

    textarea {
      width: 100%;
      height: 80vh;
      font-family: monospace;
      font-size: 1rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>Escreva o texto aqui</h1>
  <textarea id="editor" placeholder="Digite aqui..."></textarea>

  <script>
    const textarea = document.getElementById("editor");

    const ws = new WebSocket(
      window.location.protocol === "https:"
        ? "wss://" + window.location.host
        : "ws://" + window.location.host
    );

    ws.onclose = () => {
      console.warn("WebSocket desconectado. Tentando reconectar...");
      setTimeout(() => location.reload(), 3000);
    };

    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 25000); // a cada 25 segundos

    let isUpdating = false;

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "init" || msg.type === "update") {
        isUpdating = true;
        textarea.value = msg.text;
        isUpdating = false;
      }
    };

    textarea.addEventListener("input", () => {
      if (!isUpdating) {
        ws.send(JSON.stringify({ type: "update", text: textarea.value }));
      }
    });

  </script>
</body>
</html>
