<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu dontpad</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    #topbar {
      padding: 1rem;
      background: #1e1e1e;
      color: white;
      font-size: 1.2rem;
    }
    #editor {
      height: calc(100% - 60px);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
</head>
<body>
  <div id="topbar">📝 Meu dontpad</div>
  <div id="editor"></div>

  <script>
    let editor;
    let isUpdating = false;

    // WebSocket
    const ws = new WebSocket(
      window.location.protocol === "https:" ? "wss://" + window.location.host : "ws://" + window.location.host
    );

    ws.onclose = () => {
      console.warn("WebSocket desconectado. Tentando reconectar...");
      setTimeout(() => location.reload(), 3000);
    };

    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 25000); // ping a cada 25s

    // Carregar Monaco
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: "",
        language: "javascript", // você pode trocar ou fazer dinâmico
        theme: "vs-dark",
        fontSize: 16,
        automaticLayout: true
      });

      // Enviar alterações
      editor.onDidChangeModelContent(() => {
        if (!isUpdating && ws.readyState === WebSocket.OPEN) {
          const text = editor.getValue();
          ws.send(JSON.stringify({ type: "update", text }));
        }
      });

      // Receber conteúdo
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "init" || msg.type === "update") {
          if (editor) {
            isUpdating = true;
            editor.setValue(msg.text);
            isUpdating = false;
          }
        }
      };
    });
  </script>
</body>
</html>
